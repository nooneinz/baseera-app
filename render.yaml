databases:
  - name: baseera-db
    databaseName: baseera_db
    user: baseera_user
    plan: free

services:
  - type: web
    name: baseera-web
    env: python
    buildCommand: "./build.sh"
    # --timeout 120: gunicorn's default worker timeout is 30s, which is
    # tight for a live Gemini call (cold connections, an occasionally
    # slower model response, or a multi-round-trip agent action) -- a
    # worker killed mid-request returns a raw gateway error instead of a
    # JSON response, which the frontend can't parse into a real message
    # and previously showed as a generic, misleading "check your API key"
    # error even though the actual cause was just running out of time.
    #
    # --workers 2 (was 4): this service has no explicit `plan:` here, so it
    # runs on Render's free 512MB tier. Each gunicorn worker is a separate
    # process carrying its own full copy of Django + pandas + numpy +
    # openpyxl + the google-genai client -- observed OOM-killing an
    # instance ("Ran out of memory (used over 512MB)") with 4 workers even
    # before factoring in per-request memory for a 10k-row DataFrame or a
    # live model call. Threads share a worker's memory far more cheaply
    # than separate processes do, so --threads stays at 4 (2 workers x 4
    # threads = 8 concurrent request slots) while the process count that
    # actually multiplies the baseline footprint is halved. If this still
    # OOMs under real load, the fix is a bigger instance plan, not more
    # workers on the same 512MB.
    startCommand: "gunicorn baseera_web.wsgi:application --workers 2 --worker-class gthread --threads 4 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baseera-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
