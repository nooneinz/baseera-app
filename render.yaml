databases:
  - name: baseera-db
    databaseName: baseera_db
    user: baseera_user
    plan: free
  # Deliberately its own database, not a schema/table split inside
  # baseera-db above: backend/ is meant to become the sole source of
  # truth for subscriptions/invoices once a real payment gateway (Thawani)
  # is wired in, and that decision only holds if its data never lives in
  # the same database Django's dashboard/api_views.py can write to
  # directly through the Django ORM.
  - name: baseera-backend-db
    databaseName: baseera_backend_db
    user: baseera_backend_user
    plan: free

services:
  - type: web
    name: baseera-web
    env: python
    buildCommand: "./build.sh"
    # --timeout 120: gunicorn's default worker timeout is 30s, which is
    # tight for a live Gemini call (cold connections, an occasionally
    # slower model response, or a multi-round-trip agent action) -- a
    # worker killed mid-request returns a raw gateway error instead of a
    # JSON response, which the frontend can't parse into a real message
    # and previously showed as a generic, misleading "check your API key"
    # error even though the actual cause was just running out of time.
    #
    # --workers 2 (was 4): this service has no explicit `plan:` here, so it
    # runs on Render's free 512MB tier. Each gunicorn worker is a separate
    # process carrying its own full copy of Django + pandas + numpy +
    # openpyxl + the google-genai client -- observed OOM-killing an
    # instance ("Ran out of memory (used over 512MB)") with 4 workers even
    # before factoring in per-request memory for a 10k-row DataFrame or a
    # live model call. Threads share a worker's memory far more cheaply
    # than separate processes do, so --threads stays at 4 (2 workers x 4
    # threads = 8 concurrent request slots) while the process count that
    # actually multiplies the baseline footprint is halved. If this still
    # OOMs under real load, the fix is a bigger instance plan, not more
    # workers on the same 512MB.
    startCommand: "gunicorn baseera_web.wsgi:application --workers 2 --worker-class gthread --threads 4 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baseera-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

  # backend/ (ASP.NET Core): not wired to real traffic yet -- this makes it
  # deployable for real instead of the unbuilt, uncommitted scaffold it was
  # (no Dockerfile, no migrations, mocked mobile endpoints). Gets its own
  # database (baseera-backend-db above) by design: it's meant to become the
  # system of record for subscriptions/invoices once a real payment gateway
  # is wired in, and Django keeps reading that data rather than owning it
  # -- see backend/README.md for the full split.
  - type: web
    name: baseera-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DB_HOST
        fromDatabase:
          name: baseera-backend-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: baseera-backend-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: baseera-backend-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: baseera-backend-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: baseera-backend-db
          property: password
      - key: TeamApiKey
        generateValue: true
      - key: Sentry__Dsn
        sync: false
