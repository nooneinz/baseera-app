name: Baseera Enterprise CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-django:
    name: Test Django (dashboard/) — the actually-deployed service
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-a-real-secret
      DEBUG: "True"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run Django test suite
      run: python manage.py test

  build-backend:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore backend/BaseeraAPI.csproj
    - name: Build
      run: dotnet build backend/BaseeraAPI.csproj --no-restore
    - name: Test
      run: dotnet test backend/BaseeraAPI.csproj --no-build --verbosity normal

  build-flutter:
    name: Build Flutter App
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    - name: Install dependencies
      run: flutter pub get
      working-directory: ./baseera_mobile_app
    - name: Build Web
      run: flutter build web
      working-directory: ./baseera_mobile_app

  docker-compose-check:
    name: Validate Docker Infrastructure
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test Docker Compose Build
      run: docker compose config

  # No "deploy" job: this used to be a placeholder that only echoed a
  # comment ("Deployment script goes here") and never actually deployed
  # anything -- every real deploy happens outside this workflow, via
  # Render's own git-push auto-deploy on the services defined in
  # render.yaml (baseera-web, baseera-backend). A job that looks like a
  # deployment step but silently does nothing is worse than no job at
  # all: it reads as "CI handles this" when nothing does.
