<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boardroom</title>
<link rel="stylesheet" href="styles.css">
<script>(function(){var t=localStorage.getItem("baseera-theme")||"light";document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("baseera-lang")||"en";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");})();</script>
<script>
 window.BASEERA_TRANSLATIONS = {
  boardroomTitle: { en: 'Executive Boardroom', ar: 'مجلس الإدارة (غرفة الاجتماعات)' },
  boardroomDesc: { en: 'Pose any strategic decision, and 4 specialized AI agents will debate live.', ar: 'اطرح أي قرار تجاري، وسيدخل 4 وكلاء في مناظرة متكاملة.' },
  debatePromptLabel: { en: 'Strategic decision to debate?', ar: 'ما القرار الاستراتيجي المراد مناقشته؟' },
  debatePromptPlaceholder: { en: 'e.g. Should we increase prices by 10%...', ar: 'مثال: هل أرفع أسعار المنتجات بنسبة 10%...' },
  startDebateBtn: { en: 'Convene Board Debate', ar: 'بدء جلسة المجلس الآن' },
  cfoTitle: { en: 'CFO (Finance)', ar: 'CFO (المالية)' },
  cmoTitle: { en: 'CMO (Marketing)', ar: 'CMO (التسويق)' },
  cooTitle: { en: 'COO (Operations)', ar: 'COO (العمليات)' },
  pricingTitle: { en: 'Pricing Strategist', ar: 'أخصائي التسعير' },
  loadingText: { en: 'Convening Advisory Board...', ar: 'انعقاد مجلس الإدارة الاستشاري...' },
  resolutionTitle: { en: 'BOARD RESOLUTION', ar: 'القرار الاستراتيجي المعتمد' }
 };
</script>
<style>
  .board-seat {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
  }
  .board-seat.active-speaker {
    transform: scale(1.05);
    box-shadow: 0 0 0 2px #4F46E5, 0 10px 25px rgba(79,70,229,0.15);
  }
  .speaker-badge { display: none; margin-top: 0.5rem; font-size: 0.65rem; padding: 0.1rem 0.5rem; border-radius: 1rem; font-weight: bold; animation: pulse 1.5s infinite; }
  .active-speaker .speaker-badge { display: inline-block; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .speech-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    display: flex;
    gap: 0.75rem;
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

       <div data-i18n="cfoTitle" style="font-size: 0.7rem; font-weight: 700; color: #1E293B;">CFO (Finance)</div>

       <div data-i18n="cmoTitle" style="font-size: 0.7rem; font-weight: 700; color: #1E293B;">CMO (Marketing)</div>

     <div class="board-seat" id="seat-coo">
       <div style="width: 3rem; height: 3rem; background: #4F46E5; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; margin-bottom: 0.5rem;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg></div>
       <div data-i18n="cooTitle" style="font-size: 0.7rem; font-weight: 700; color: #1E293B;">COO (Operations)</div>
       <div class="speaker-badge" style="background: rgba(79,70,229,0.1); color: #4F46E5;"> Speaking</div>
     </div>
     <div class="board-seat" id="seat-pricing">
       <div style="width: 3rem; height: 3rem; background: #EF4444; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; margin-bottom: 0.5rem;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></div>
       <div data-i18n="pricingTitle" style="font-size: 0.7rem; font-weight: 700; color: #1E293B;">Pricing Strategist</div>
       <div class="speaker-badge" style="background: rgba(239,68,68,0.1); color: #EF4444;"> Speaking</div>
     </div>
   </div>

   <!-- Live Stream -->
   <div id="loadingIndicator" style="display: none; text-align: center; padding: 2rem 0;">
     <div style="display: inline-block; width: 2rem; height: 2rem; border: 3px solid #e0f2fe; border-top-color: #0284c7; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 0.5rem;"></div>
     <div data-i18n="loadingText" style="font-size: 0.75rem; font-weight: bold; color: #475569;">Convening Advisory Board...</div>
     <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
   </div>

   <div id="speechesList"></div>

   <!-- Resolution -->

<script src="app.js"></script>
<script src="translations.js"></script>

<script>
 function renderDate() {
  const isAr = (document.documentElement.getAttribute('lang') || 'en') === 'ar';
  const dayEl = document.getElementById('dash-day-label');
  if (dayEl) {
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    dayEl.textContent = new Date().toLocaleDateString(isAr ? 'ar-SA' : 'en-US', options);
  }
  
  document.getElementById('topicInput').placeholder = window.BASEERA_TRANSLATIONS['debatePromptPlaceholder'][isAr ? 'ar' : 'en'];
 }

 const SEAT_INFO = [
   { id: 'financial', color: '#10b981', icon: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>' },
   { id: 'marketing', color: '#f59e0b', icon: '<circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle>' },
   { id: 'coo', color: '#0ea5e9', icon: '<rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle>' },
   { id: 'pricing', color: '#a855f7', icon: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line>' }
 ];

 async function startDebate() {
   const topic = document.getElementById('topicInput').value.trim();
   if (!topic) return;

   document.getElementById('startBtn').disabled = true;
   document.getElementById('speechesList').innerHTML = '';
   document.getElementById('resolutionCard').style.display = 'none';
   document.getElementById('loadingIndicator').style.display = 'block';

   const isAr = (document.documentElement.getAttribute('lang') || 'en') === 'ar';

   try {
     const response = await fetch('http://127.0.0.1:8000/api/boardroom/debate/', {
       method: 'POST',
       headers: {
         'Content-Type': 'application/json',
         'Authorization': 'Bearer ' + (localStorage.getItem('basira_token') || '')
       },
       body: JSON.stringify({ topic: topic })
     });

     if (!response.ok) throw new Error('API Request Failed');
     const result = await response.json();
     const debateData = result.data || result; // Fallback in case format differs
     
     document.getElementById('loadingIndicator').style.display = 'none';

     const messages = debateData.messages || [];
     for (let i = 0; i < messages.length; i++) {
       const msg = messages[i];
       // Assign a seat visually
       const seatIndex = i % SEAT_INFO.length;
       const spk = SEAT_INFO[seatIndex];
       
       // Highlight active seat
       document.querySelectorAll('.board-seat').forEach(el => el.classList.remove('active-speaker'));
       const seatEl = document.getElementById(`seat-${spk.id}`);
       if (seatEl) {
         seatEl.classList.add('active-speaker');
         seatEl.querySelector('div:nth-child(2)').textContent = msg.agentName || msg.role || "Agent";
       }

       const card = document.createElement('div');
       card.className = 'speech-card';
       card.innerHTML = `
        <div style="width: 2.5rem; height: 2.5rem; border-radius: 0.75rem; display: flex; justify-content: center; align-items: center; color: white; background: ${spk.color}; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">${spk.icon}</svg>
        </div>
        <div>
          <div style="font-weight: 900; font-size: 0.75rem; color: #0f172a; margin-bottom: 0.25rem;">${msg.agentName || msg.role} <span style="color: #64748b; font-size: 0.65rem;">(${msg.role})</span></div>
          <div style="font-size: 0.7rem; color: #475569; line-height: 1.4;">${msg.text}</div>
        </div>
       `;
       document.getElementById('speechesList').appendChild(card);
       card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

       await new Promise(r => setTimeout(r, 2000));
     }

     document.querySelectorAll('.board-seat').forEach(el => el.classList.remove('active-speaker'));
     
     let resolutionHtml = "";
     if (debateData.consensusPlan) {
       resolutionHtml = `<strong>${debateData.consensusPlan.title || 'Resolution'}</strong><br/>
       ${debateData.consensusPlan.summary}<br/><br/>
       <ul style="margin:0; padding-left:1rem;">
         ${(debateData.consensusPlan.actionSteps || []).map(step => `<li>${step}</li>`).join('')}
       </ul>`;
     } else if (debateData.resolution && typeof debateData.resolution === 'object') {
       resolutionHtml = `<strong>${isAr ? 'القرار:' : 'Decision:'}</strong> ${debateData.resolution.decision || ''}<br/><br/>
       <strong>${isAr ? 'خطوات العمل:' : 'Action Items:'}</strong>
       <ul style="margin:0; padding-left:1rem; margin-top: 0.25rem;">
         ${(debateData.resolution.action_items || []).map(step => `<li style="margin-bottom: 0.25rem;">${step}</li>`).join('')}
       </ul>`;
     } else {
       resolutionHtml = debateData.resolution || "تم التوصل إلى قرار.";
     }
     
     document.getElementById('resolutionText').innerHTML = resolutionHtml;
     document.getElementById('resolutionCard').style.display = 'block';
     document.getElementById('resolutionCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

   } catch (error) {
     console.error(error);
     document.getElementById('loadingIndicator').style.display = 'none';
     alert(isAr ? 'حدث خطأ أثناء الاتصال بالوكلاء. يرجى المحاولة مرة أخرى.' : 'Failed to connect to the agents. Please try again.');
   }

   document.getElementById('startBtn').disabled = false;
 }

 document.addEventListener('DOMContentLoaded', renderDate);
 document.addEventListener('langChanged', renderDate);
</script>
</body>
</html>
