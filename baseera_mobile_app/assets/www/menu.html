<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baseera - Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body {
    background: #f8fafc;
    margin: 0;
    padding: 0;
  }
  html[data-theme="dark"] body {
    background: #111827;
    color: #f8fafc;
  }
  .clean-menu-container {
    padding: 1.5rem 1.25rem 5rem 1.25rem;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .clean-menu-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 1.5rem;
  }
  .clean-menu-close {
    background: transparent;
    border: none;
    cursor: pointer;
    color: #0f172a;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }
  html[data-theme="dark"] .clean-menu-close {
    color: #f8fafc;
  }
  .clean-menu-list {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .clean-menu-item {
    display: block;
    padding: 0.75rem 0.5rem;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1e293b;
    text-decoration: none;
    border-radius: 8px;
    transition: color 0.2s, background-color 0.15s;
  }
  .clean-menu-item:hover {
    color: #542DFF;
    background-color: rgba(84, 45, 255, 0.05);
  }
  html[data-theme="dark"] .clean-menu-item {
    color: #f1f5f9;
  }
  html[data-theme="dark"] .clean-menu-item:hover {
    color: #a78bfa;
    background-color: rgba(167, 139, 250, 0.08);
  }
  .clean-menu-divider {
    height: 1px;
    background: rgba(0, 0, 0, 0.06);
    margin: 1.5rem 0.5rem 1rem 0.5rem;
  }
  html[data-theme="dark"] .clean-menu-divider {
    background: rgba(255, 255, 255, 0.08);
  }
  .clean-menu-sublist {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    padding-top: 1rem;
  }
  .clean-menu-subitem {
    display: block;
    padding: 0.65rem 0.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: #64748b;
    text-decoration: none;
    border-radius: 8px;
    transition: color 0.2s, background-color 0.15s;
  }
  .clean-menu-subitem:hover {
    color: #0f172a;
    background-color: rgba(0, 0, 0, 0.04);
  }
  html[data-theme="dark"] .clean-menu-subitem {
    color: #94a3b8;
  }
  html[data-theme="dark"] .clean-menu-subitem:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.06);
  }
</style>
</head>
<body>

<div class="app-shell">
 <div class="clean-menu-container">
  <div class="clean-menu-header">
   <button class="clean-menu-close" onclick="window.history.back()" title="Close">

     <line x1="18" y1="6" x2="6" y2="18"></line>
     <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
   </button>
  </div>

    <div class="clean-menu-list">

    </div>

   <a href="datasets.html" class="clean-menu-item" data-i18n="datasetsItem">Datasets</a>

   <a href="insights.html" class="clean-menu-item" data-i18n="insightsItem">Insights & Analytics</a>
   <a href="history.html" class="clean-menu-item" data-i18n="historyItem">History</a>
   <a href="templates_feedback.html" class="clean-menu-item" data-i18n="formsItem">Feedback</a>
   <a href="history.html" class="clean-menu-item" data-i18n="historyItem">History</a>
  </div>

  <div class="clean-menu-sublist">
   <div class="clean-menu-divider"></div>

   <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 11.5px; color: #2b2470; margin-bottom: 6px;">

     <span></span>

   </div>
   <div style="width: 100%; height: 6px; background: rgba(0,0,0,0.08); border-radius: 10px; overflow: hidden; margin-bottom: 6px;">
    <div id="trial-progress-bar" style="width: 100%; height: 100%; background: linear-gradient(90deg, #2b2470 0%, #7c6cf0 100%); border-radius: 10px; transition: width 0.3s ease;"></div>
   </div>
   <div style="font-size: 9.5px; color: #64748b; font-weight: 600; text-align: start;" id="trial-sub-text" data-i18n="trialSubText">14 days remaining on free trial</div>
  </div>
   <a href="pricing.html" class="clean-menu-subitem" data-i18n="upgradeAccountBtn" style="font-weight: 800; color: #4f46e5;">Upgrade Account</a>
   <a href="settings.html" class="clean-menu-subitem" data-i18n="settingsItem">Settings</a>
   <a href="welcome.html" class="clean-menu-subitem" style="color: #ef4444;" data-i18n="logoutBtn">Log Out</a>
  </div>
 </div>

</div>

<script src="translations.js"></script>

</body>
</html>
