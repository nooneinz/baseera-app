version: '3.8'

services:
  baseera-db:
    image: postgres:15
    container_name: baseera-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baseera_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      POSTGRES_DB: ${POSTGRES_DB:-baseera_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baseera-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baseera_user} -d ${POSTGRES_DB:-baseera_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  baseera-redis:
    image: redis:alpine
    container_name: baseera-redis
    restart: always
    expose:
      - "6379"
    command: redis-server --save 60 1 --loglevel warning --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - baseera-private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  baseera-storage:
    image: minio/minio
    container_name: baseera-minio
    restart: always
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-baseera_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_now}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - baseera-private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: baseera-nginx
    restart: always
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - baseera-private
    depends_on:
      baseera-db:
        condition: service_healthy
      baseera-redis:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: baseera-n8n
    restart: always
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Muscat
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - baseera-private
    depends_on:
      baseera-db:
        condition: service_healthy
      baseera-redis:
        condition: service_healthy

  baseera-sandbox:
    build: ./sandbox
    container_name: baseera-sandbox
    restart: always
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - baseera-private
    # Deliberately no `secrets:` here: this container only ever executes
    # arbitrary AI-generated Python (see sandbox/main.py) and has no
    # legitimate use for the Gemini key. Least privilege matters more here
    # than anywhere else in the stack -- code run here is exactly the
    # thing that would try to read and print a secret it can reach.

networks:
  baseera-private:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:

secrets:
  gemini_api_key:
    file: ./gemini_api_key.txt
